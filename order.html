<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Reservasi</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #ffffff;
      --muted: rgba(248, 250, 252, 0.8);
      --border: rgba(255, 255, 255, 0.35);
      --focus-ring: rgba(255, 255, 255, 0.22);
      --success-bg: rgba(22, 163, 74, 0.35);
      --success-text: #dcfce7;
      --error-bg: rgba(185, 28, 28, 0.55);
      --error-text: #fecaca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Layer foto latar belakang dengan animasi muncul dari bawah */
    .bg-photo {
      position: fixed;
      inset: 0;
      background-image: url("fotoorder.jfif"); /* Ganti dengan nama file fotomu */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -2;
      animation: munculDariBawah 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(15, 23, 42, 0.45) 0%,
        rgba(15, 23, 42, 0.3) 50%,
        rgba(15, 23, 42, 0.5) 100%
      );
      z-index: -1;
    }

    @keyframes munculDariBawah {
      0% {
        opacity: 0;
        transform: translateY(80px) scale(1.04);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Kartu formulir blur menyatu di tengah */
    .reservation-card {
      position: relative;
      overflow: hidden;
      background-image:
        linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.24),
          rgba(255, 255, 255, 0.14)
        ),
        url("bg-kartu-login.jpg"); /* Opsional: gambar tambahan di dalam kartu */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      padding: 2rem;
    }

    .form-header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      padding-bottom: 1rem;
    }

    .form-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .form-header p {
      font-size: 0.9rem;
      color: var(--muted);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      margin-top: 0.25rem;
    }

    .status-box {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .status-box.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(134, 239, 172, 0.4);
    }

    .status-box.error {
      display: block;
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(252, 165, 165, 0.4);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #f8fafc;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    input,
select,
textarea {
  width: 100%;
  padding: 0.7rem 0.9rem;
  font-size: 16px; /* 16px mencegah layar HP otomatis melakukan zoom saat mengetik */
  font-family: inherit;
  color: #ffffff;
  background-color: rgba(15, 23, 42, 0.88);
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  border-radius: 8px;
  transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
}

input::placeholder,
textarea::placeholder {
  color: rgba(255, 255, 255, 0.65);
}

select option {
  background-color: #0f172a;
  color: #ffffff;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  background-color: #090d16;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
}

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .form-actions {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn-submit {
      width: 100%;
      padding: 0.8rem 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-primary {
      display: block;
      text-align: center;
      text-decoration: none;
      width: 100%;
      padding: 0.7rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: rgba(255, 255, 255, 0.26);
    }

    /* Pop-up Modal */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 999;
    }

    .popup-overlay.show {
      display: flex;
    }

    .popup-card {
      background: #ffffff;
      color: #0f172a;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: popupFade 0.2s ease-out;
    }

    @keyframes popupFade {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .popup-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      background-color: #dcfce7;
      color: #166534;
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup-card h2 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 0.4rem;
    }

    .popup-card p {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1rem;
    }

    .popup-details {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      text-align: left;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }

    .popup-details div {
      margin-bottom: 0.35rem;
    }

    .popup-details div:last-child {
      margin-bottom: 0;
    }

    .btn-close-popup {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-close-popup:hover {
      background-color: var(--primary-hover);
    }

    @media (max-width: 540px) {
      .reservation-card {
        padding: 1.5rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="bg-photo" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <main class="reservation-card">
    <div class="form-header">
      <h1>Formulir Reservasi</h1>
      <p>Silakan lengkapi detail pemesanan Anda di bawah ini.</p>
    </div>

    <div id="statusBox" class="status-box" role="alert"></div>

    <form id="reservationForm">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="nama_lengkap">Nama Lengkap</label>
          <input type="text" id="nama_lengkap" name="nama_lengkap" placeholder="Contoh: Budi Santoso" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="budi@email.com" required />
        </div>

        <div class="form-group">
          <label for="nomor_telepon">Nomor WhatsApp / Telepon</label>
          <input type="tel" id="nomor_telepon" name="nomor_telepon" placeholder="081234567890" required />
        </div>

        <div class="form-group">
          <label for="tanggal_reservasi">Tanggal Reservasi</label>
          <input type="date" id="tanggal_reservasi" name="tanggal_reservasi" required />
        </div>

        <div class="form-group">
          <label for="layanan_paket">Pilihan Layanan / Paket</label>
          <select id="layanan_paket" name="layanan_paket" required>
            <option value="" disabled selected>Pilih layanan...</option>
            <option value="Meja Reguler">Meja Reguler</option>
            <option value="VIP Room">VIP Room</option>
            <option value="Paket Acara / Grup">Paket Acara / Grup</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="catatan">Catatan Tambahan (Opsional)</label>
          <textarea id="catatan" name="catatan" placeholder="Permintaan khusus, alergi makanan, dll."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Konfirmasi Reservasi</button>
        <a href="beranda.html" class="btn-primary">Kembali ke Beranda</a>
      </div>
    </form>
  </main>

  <!-- Pop-up Konfirmasi Reservasi -->
  <div id="popupModal" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup-card">
      <div class="popup-icon">✓</div>
      <h2 id="popupTitle">Reservasi Berhasil Masuk!</h2>
      <p>Data reservasi Anda telah tercatat. Simpan detail berikut:</p>
      <div id="popupDetails" class="popup-details"></div>
      <button type="button" id="closePopupBtn" class="btn-close-popup">Tutup</button>
    </div>
  </div>

  <script>
    const form = document.getElementById("reservationForm");
    const statusBox = document.getElementById("statusBox");
    const submitBtn = form.querySelector(".btn-submit");
    const popupModal = document.getElementById("popupModal");
    const popupDetails = document.getElementById("popupDetails");
    const closePopupBtn = document.getElementById("closePopupBtn");

    function showStatus(type, message) {
      statusBox.className = "status-box " + type;
      statusBox.textContent = message;
    }

    function openPopup(data) {
      const catatanTeks = data.catatan ? data.catatan : "-";
      popupDetails.innerHTML = `
        <div><strong>Kode Reservasi:</strong> ${data.kodeBooking}</div>
        <div><strong>Nama:</strong> ${data.nama}</div>
        <div><strong>Tanggal:</strong> ${data.tanggal}</div>
        <div><strong>Layanan / Paket:</strong> ${data.paket}</div>
        <div><strong>Catatan:</strong> ${catatanTeks}</div>
      `;
      popupModal.classList.add("show");
    }

    function closePopup() {
      popupModal.classList.remove("show");
      window.location.href = "beranda.html";
    }

    closePopupBtn.addEventListener("click", closePopup);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Memproses...";

      const nama = document.getElementById("nama_lengkap").value.trim();
      const tanggal = document.getElementById("tanggal_reservasi").value;
      const paket = document.getElementById("layanan_paket").value;
      const catatan = document.getElementById("catatan").value.trim();

      if (!nama || !tanggal || !paket) {
        showStatus("error", "Mohon lengkapi semua field yang wajib diisi.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Konfirmasi Reservasi";
        return;
      }

      const kodeBooking = "RSV-" + Math.floor(1000 + Math.random() * 9000);

      showStatus(
        "success",
        `Reservasi atas nama ${nama} untuk paket "${paket}" pada tanggal ${tanggal} berhasil dicatat (Kode: ${kodeBooking}).`
      );

      openPopup({ kodeBooking, nama, tanggal, paket, catatan });

      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = "Konfirmasi Reservasi";
    });
  </script>
</body>
</html>
